name: CI/CD Deploy NestJS Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Node
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # 3. Install
      - name: Install dependencies
        run: npm ci

      # 4. Build
      - name: Build project
        run: npm run build

      # 5. DockerHub login
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build image
      - name: Build Docker image
        run: docker build -t fazliddinwrest/warranty_backend:latest .

      # 7. Push image
      - name: Push Docker image
        run:
          docker push fazliddinwrest/warranty_backend:latest

          # 8. Write SSH key
      - name: Write SSH key
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      # 9. Deploy via SSH
      - name: Deploy to server
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            docker pull fazliddinwrest/warranty_backend:latest

            docker stop warranty_backend || true
            docker rm -f warranty_backend || true

            docker run -d \
              --name warranty_backend \
              --restart unless-stopped \
              -p 3000:3000 \
              fazliddinwrest/warranty_backend:latest
             EOF

      # 10. Cleanup key
      - name: Cleanup SSH key
        run: rm -f private_key.pem
