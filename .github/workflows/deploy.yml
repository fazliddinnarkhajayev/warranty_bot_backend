name: CI/CD Deploy NestJS Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Node
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # 3. Install
      - name: Install dependencies
        run: npm ci

      # 4. Build
      - name: Build project
        run: npm run build

      # 5. DockerHub login
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build image
      - name: Build Docker image
        run: docker build -t fazliddinwrest/warranty_backend:latest .

      # 7. Push image
      - name: Push Docker image
        run: docker push fazliddinwrest/warranty_backend:latest

        # 9. Deploy via SSH with password
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to server
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << EOF
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            docker pull fazliddinwrest/warranty_backend:latest

            docker stop warranty_backend || true
            docker rm -f warranty_backend || true

            docker run -d \
              --name warranty_backend \
              --restart unless-stopped \
              -p 3000:3000 \
              fazliddinwrest/warranty_backend:latest
          EOF
